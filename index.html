<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>红黄蓝看板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%82%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1d22; --panel:#10313a;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.17);
  --ink:#ecf5f2; --dim:#8fb0ac; --faint:#5c7e7b;
  --amber:#ffb84d; --teal:#2fd6b5; --lime:#9be15d; --danger:#ff6b5e;
  --card:#f7f3ea; --card-ink:#233a40; --card-dim:#6c8289;
  --disp:'Sora','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --body:ui-sans-serif,system-ui,'PingFang SC','Microsoft YaHei',sans-serif;
  --ease:cubic-bezier(.22,.9,.3,1);
  --sh-card:0 1px 2px rgba(3,15,18,.25),0 6px 16px -8px rgba(3,15,18,.42);
  --sh-lift:0 18px 40px -12px rgba(2,12,15,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{
  font-family:var(--body);color:var(--ink);overflow:hidden;
  background:
    radial-gradient(1100px 700px at 88% -12%, rgba(47,214,181,.13), transparent 60%),
    radial-gradient(900px 640px at -8% 108%, rgba(255,184,77,.10), transparent 60%),
    linear-gradient(158deg,#0c2329 0%,#0a1d22 46%,#081a20 100%);
}
body::before{content:'';position:fixed;inset:-20%;z-index:0;pointer-events:none;
  background:radial-gradient(620px 430px at 22% 28%,rgba(47,214,181,.075),transparent 70%),
             radial-gradient(720px 520px at 78% 72%,rgba(255,184,77,.06),transparent 70%);
  animation:drift 26s ease-in-out infinite alternate}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.4px);
  background-size:26px 26px;
  mask-image:radial-gradient(ellipse at 50% 18%,#000,transparent 88%)}
@keyframes drift{to{transform:translate(3%,-4%) scale(1.06)}}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
::selection{background:rgba(255,184,77,.35)}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
input,textarea{font-family:inherit}
input[type="date"],input[type="datetime-local"]{color-scheme:dark}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
::-webkit-scrollbar{height:10px;width:9px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background-color:rgba(255,255,255,.3)}
::-webkit-scrollbar-track{background:transparent}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}

/* ===== 顶栏 ===== */
.topbar{position:relative;z-index:20;display:flex;align-items:center;gap:14px;height:62px;padding:0 20px;flex:none;
  background:linear-gradient(180deg,rgba(13,39,46,.9),rgba(13,39,46,.6));
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{width:32px;height:32px;flex:none;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,#ff6b5e,#ffb84d 46%,#4aa8ff);box-shadow:0 4px 14px -4px rgba(255,184,77,.5)}
.brand h1{font:800 17px/1.2 var(--disp);letter-spacing:.4px;outline:none;border-radius:6px;padding:1px 5px;margin-left:-5px;caret-color:var(--amber);min-width:30px}
.brand h1:focus{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--line-2)}
.brand h1:empty::before{content:'未命名看板';color:var(--faint)}
.crumb{display:block;font-size:11.5px;color:var(--faint);padding-left:1px;margin-top:1px}
.crumb b{color:var(--dim);font:700 11px var(--disp);letter-spacing:.04em}
.tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.search{display:flex;align-items:center;gap:7px;background:rgba(6,24,28,.6);border:1px solid var(--line);border-radius:10px;padding:0 11px;height:34px;color:var(--faint);transition:.18s}
.search:focus-within{border-color:rgba(47,214,181,.6);box-shadow:0 0 0 3px rgba(47,214,181,.14);color:var(--teal)}
.search input{background:none;border:0;outline:none;color:var(--ink);font-size:13px;width:158px}
.search input::placeholder{color:var(--faint)}
.filters{display:flex;gap:7px;align-items:center;padding:0 2px}
.fsw{width:18px;height:18px;border-radius:6px;background:var(--c);opacity:.45;transition:.16s var(--ease)}
.fsw:hover{opacity:.95;transform:scale(1.15)}
.fsw.on{opacity:1;transform:scale(1.06);box-shadow:0 0 0 2px #0a1d22,0 0 0 3.5px var(--c)}
.avatars{position:relative;display:flex;align-items:center}
.av-row{display:flex;align-items:center;padding-left:7px}
.av{width:28px;height:28px;border-radius:50%;background:var(--c);color:#0a2227;font-weight:800;font-size:12px;
  display:grid;place-items:center;border:2px solid rgba(10,29,34,.95);margin-left:-8px;transition:.16s var(--ease);overflow:hidden}
.av:hover{transform:translateY(-3px)}
.av.add{background:rgba(255,255,255,.07);color:var(--dim);border:1.5px dashed var(--line-2);font-weight:600}
.mem-pop{position:absolute;top:42px;right:0;z-index:80;width:248px;background:#0e2d34;border:1px solid var(--line-2);
  border-radius:14px;padding:13px;box-shadow:0 22px 54px -12px rgba(0,0,0,.72);
  display:flex;flex-direction:column;gap:10px;transform-origin:top right;animation:popIn .2s var(--ease)}
.vr{width:1px;height:22px;background:var(--line-2)}
.btn{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;border-radius:10px;
  padding:8px 14px;border:1px solid transparent;transition:.18s var(--ease);white-space:nowrap}
.btn-primary{background:linear-gradient(180deg,#ffc766,#ffab2e);color:#3a2405;box-shadow:0 6px 18px -6px rgba(255,171,46,.55)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 22px -6px rgba(255,171,46,.65)}
.btn-primary:active{transform:scale(.97)}
.btn-ghost{color:var(--dim)}
.btn-ghost:hover{background:rgba(255,255,255,.07);color:var(--ink)}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
.btn-danger{color:#ff9d93;background:rgba(255,107,94,.08);border-color:rgba(255,107,94,.35)}
.btn-danger:hover{background:var(--danger);color:#fff}
.icon-btn{width:28px;height:28px;border-radius:8px;display:inline-grid;place-items:center;color:var(--dim);font-size:13px;transition:.15s}
.icon-btn:hover{background:rgba(255,255,255,.09);color:var(--ink)}
.icon-btn svg{display:block}
.field{background:rgba(6,24,28,.65);border:1px solid var(--line);color:var(--ink);border-radius:10px;
  padding:8px 12px;font-size:13px;transition:.16s;width:100%}
.field:focus{outline:none;border-color:rgba(47,214,181,.6);box-shadow:0 0 0 3px rgba(47,214,181,.14)}
.field::placeholder{color:var(--faint)}

/* ===== 看板 ===== */
.board-wrap{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;padding:22px 26px}
.board{display:flex;align-items:flex-start;height:100%}
.list{width:300px;flex:0 0 300px;max-height:100%;display:flex;flex-direction:column;margin-right:18px;
  background:linear-gradient(180deg,rgba(24,58,68,.92),rgba(15,38,45,.95));
  border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 34px -20px rgba(0,0,0,.65);
  transition:border-color .2s,box-shadow .2s}
.list--over{border-color:rgba(47,214,181,.5);box-shadow:0 0 0 1px rgba(47,214,181,.28),0 14px 40px -18px rgba(47,214,181,.35)}
.list-head{position:relative;display:flex;align-items:center;gap:8px;padding:13px 10px 8px 14px;cursor:grab;flex:none;touch-action:none}
.list-dot{width:9px;height:9px;flex:none;border-radius:3px;background:var(--c);box-shadow:0 0 9px var(--c)}
.list-title{flex:1;min-width:0;font:600 14.5px var(--disp);letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab}
.count{font:700 11px var(--disp);color:var(--dim);background:rgba(255,255,255,.08);padding:2.5px 8px;border-radius:999px;flex:none}
.rn{flex:1;min-width:60px;font:600 14.5px var(--disp);color:var(--ink);background:rgba(6,24,28,.75);
  border:1px solid rgba(47,214,181,.55);border-radius:7px;padding:2px 7px;outline:none}
.lmenu{position:absolute;right:6px;top:44px;z-index:60;min-width:160px;padding:6px;display:flex;flex-direction:column;gap:2px;
  background:#0e2d34;border:1px solid var(--line-2);border-radius:12px;box-shadow:0 20px 50px -12px rgba(0,0,0,.7);
  transform-origin:top right;transform:scale(.92) translateY(-5px);opacity:0;pointer-events:none;transition:.16s var(--ease)}
.lmenu.open{transform:none;opacity:1;pointer-events:auto}
.lmenu button{text-align:left;padding:8px 11px;border-radius:8px;font-size:13px;color:var(--ink);transition:.12s}
.lmenu button:hover{background:rgba(255,255,255,.08);padding-left:14px}
.lmenu .danger{color:#ff9d93}
.lmenu .danger:hover{background:rgba(255,107,94,.14)}
.cards{overflow-y:auto;overscroll-behavior:contain;padding:5px 10px 8px;min-height:26px;flex:1 1 auto}
.cards:empty::after{content:'暂无卡片 · 拖到这里';display:block;border:1.5px dashed var(--line-2);color:var(--faint);
  font-size:12px;text-align:center;padding:18px 8px;border-radius:12px;margin:2px 0 4px}
.card{position:relative;background:linear-gradient(180deg,#fbf8f1,#f3eee1);color:var(--card-ink);
  border:1px solid rgba(0,0,0,.06);border-radius:12px;padding:10px 12px 11px;margin-bottom:10px;
  box-shadow:var(--sh-card);cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;
  transition:transform .18s var(--ease),box-shadow .18s var(--ease),opacity .25s,filter .25s}
.card:hover{transform:translateY(-2px);box-shadow:var(--sh-lift)}
.card.faded{opacity:.14;filter:grayscale(.7);pointer-events:none}
.card.lifted{opacity:.22;filter:saturate(.4);transform:scale(.97)}
.card.is-hidden{background:linear-gradient(180deg,#eef0e9,#e6e8df);border:1px dashed rgba(35,58,64,.25)}
.card.overdue::before{content:'';position:absolute;left:-1px;top:12px;bottom:12px;width:3.5px;border-radius:4px;background:var(--danger)}
.hidden-mask{display:flex;align-items:center;gap:8px;color:#93a3a7;font-size:12px;font-weight:600;padding:3px 1px}
.hidden-mask svg{opacity:.8}
.labels{display:flex;gap:4px;margin-bottom:8px}
.lab-bar{width:34px;height:7px;border-radius:4px;background:var(--c)}
.card-title{font-size:13.5px;line-height:1.5;font-weight:600;overflow-wrap:anywhere}
.card-desc{margin-top:6px;font-size:12px;line-height:1.55;color:#5b7076;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{display:inline-flex;align-items:center;gap:4px;font:700 11px var(--disp);padding:2.5px 7px;border-radius:7px;color:var(--card-dim);background:rgba(35,58,64,.08)}
.chip.done{color:#0c7a5f;background:rgba(24,163,127,.18)}
.chip.soon{color:#5c3a00;background:var(--amber)}
.chip.warn{color:#fff;background:var(--danger);animation:blink 1.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.55}}
.chip svg{display:block}
.mini-avatars{margin-left:auto;display:flex}
.mav{width:20px;height:20px;border-radius:50%;font-size:10px;font-weight:800;display:grid;place-items:center;
  color:#0a252b;background:var(--c);border:2px solid #f6f2e8;margin-left:-6px}
.card-acts{position:absolute;top:6px;right:6px;display:flex;gap:4px;opacity:0;transform:translateY(-3px);transition:.15s;z-index:2}
.card:hover .card-acts,.card:focus-within .card-acts{opacity:1;transform:none}
.card-act{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;color:var(--card-dim);
  background:rgba(35,58,64,.09);transition:.13s}
.card-act svg{display:block}
.card-act:hover{color:#fff}
.card-act.copy:hover{background:#23a184}
.card-act.eye:hover{background:#3a7bd5}
.card-act.del:hover{background:var(--danger)}
.card.ph{background:rgba(47,214,181,.07);border:1.6px dashed rgba(47,214,181,.55);box-shadow:none;cursor:default}
.card.ph>*{opacity:0}
.list.ph{background:rgba(47,214,181,.045);border:1.6px dashed rgba(47,214,181,.5);box-shadow:none}
.list.ph>*{opacity:.06;filter:saturate(0)}
.card.l-out{overflow:hidden;opacity:0!important;margin-bottom:0!important;padding-top:0!important;padding-bottom:0!important;border-color:transparent!important;pointer-events:none}
.card.collapse,.list.collapse,.card.l-out{transition:all .27s var(--ease)!important}
.list.l-out{overflow:hidden;opacity:0;margin-right:0;border-width:0!important;padding:0}
.pop-in{animation:popIn .32s var(--ease)}
@keyframes popIn{from{opacity:0;transform:translateY(9px) scale(.95)}}
.list-pop{animation:listIn .38s var(--ease)}
@keyframes listIn{from{opacity:0;transform:translateX(26px) scale(.98)}}
.ghost{position:fixed;left:0;top:0;z-index:400;pointer-events:none;will-change:transform;opacity:.98}
.ghost.card{box-shadow:0 26px 50px -12px rgba(2,14,17,.6),0 10px 20px rgba(2,14,17,.35);transition:none;cursor:grabbing}
.ghost.list{box-shadow:0 32px 70px -18px rgba(2,14,17,.7);overflow:hidden}
.ghost.list .cards{overflow:hidden}
body.is-dragging{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
body.is-dragging .card:hover{transform:none;box-shadow:var(--sh-card)}
.list-composer{flex:0 0 300px;width:300px}
.lc-open{width:100%;text-align:left;padding:13px 16px;border-radius:16px;color:var(--dim);font-weight:600;font-size:13.5px;
  background:rgba(255,255,255,.05);border:1px dashed transparent;transition:.18s var(--ease)}
.lc-open:hover{background:rgba(255,255,255,.09);color:var(--ink);border-color:var(--line-2);transform:translateY(-1px)}
.lc-form{background:linear-gradient(180deg,rgba(24,58,68,.92),rgba(15,38,45,.95));border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:9px}
.composer{flex:none;padding:0 10px 10px}
.composer-open{width:100%;text-align:left;padding:8px 10px;border-radius:10px;color:var(--dim);font-size:13px;font-weight:600;transition:.15s}
.composer-open:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.composer-form{display:flex;flex-direction:column;gap:8px}
.composer-form textarea{width:100%;background:var(--card);color:var(--card-ink);border:1px solid transparent;border-radius:10px;
  padding:9px 11px;font-size:13px;line-height:1.5;min-height:58px;resize:none;box-shadow:var(--sh-card);transition:.15s}
.composer-form textarea:focus{outline:none;border-color:var(--teal)}
.row{display:flex;gap:8px;align-items:center}

/* ===== 卡片弹窗 ===== */
.overlay{position:fixed;inset:0;z-index:500;background:rgba(4,15,18,.58);backdrop-filter:blur(4px);opacity:0;transition:opacity .3s}
.overlay.show{opacity:1}
.modal{position:fixed;z-index:501;display:flex;overflow:hidden;
  background:linear-gradient(180deg,#153a43,#0f2b33);border:1px solid var(--line-2);
  box-shadow:0 40px 90px -22px rgba(0,0,0,.75)}
.modal.anim{transition:left .4s cubic-bezier(.3,.9,.35,1),top .4s cubic-bezier(.3,.9,.35,1),
  width .4s cubic-bezier(.3,.9,.35,1),height .4s cubic-bezier(.3,.9,.35,1),
  border-radius .4s cubic-bezier(.3,.9,.35,1),opacity .26s,transform .26s}
.modal-in{width:100%;height:100%;overflow:auto;padding:20px 24px 26px}
.m-close{position:absolute;top:12px;right:12px;z-index:5;width:32px;height:32px;border-radius:10px;
  background:rgba(255,255,255,.07);color:var(--dim);font-size:14px}
.m-close:hover{background:rgba(255,255,255,.15);color:var(--ink)}
.m-top{padding-right:40px;min-height:26px;margin-bottom:6px}
.m-chips{display:flex;flex-wrap:wrap;gap:6px}
.m-chip{background:var(--c);color:#fff;font-size:11.5px;font-weight:700;padding:3px 11px;border-radius:999px;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.m-empty{font-size:12px;color:var(--faint)}
.m-title{width:100%;background:transparent;border:0;border-bottom:1.5px solid transparent;color:var(--ink);
  font:700 21px/1.35 var(--disp);padding:2px 0 6px;transition:.15s;outline:none}
.m-title:focus{border-bottom-color:rgba(47,214,181,.5)}
.m-crumb{font-size:12px;color:var(--faint);margin-top:4px}
.m-crumb b{color:var(--dim)}
.m-sec{margin-top:22px}
.m-sec h4{display:flex;align-items:center;gap:7px;font:700 11.5px var(--disp);letter-spacing:.14em;color:var(--dim);margin-bottom:11px}
.m-sec h4 svg{opacity:.85}
.m-sec h4 .cnt{margin-left:auto;letter-spacing:0;font-size:11px;color:var(--faint);font-weight:600}
.dswitch{margin-left:auto;display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  font:600 11px var(--body);letter-spacing:0;color:var(--faint);user-select:none;transition:color .15s}
.dswitch:hover{color:var(--dim)}
.dswitch input{display:none}
.dswitch i{width:28px;height:16px;flex:none;border-radius:99px;background:rgba(255,255,255,.14);position:relative;transition:.2s}
.dswitch i::after{content:'';position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:.2s var(--ease)}
.dswitch input:checked+i{background:linear-gradient(90deg,var(--teal),var(--lime))}
.dswitch input:checked+i::after{left:14px}
.m-dates{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.m-date{display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--faint);font-weight:700}
.m-date input{width:auto;min-width:158px}
.m-palette{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center}
.sw-wrap{position:relative;display:inline-block}
.sw{width:48px;height:30px;border-radius:9px;background:var(--c);position:relative;transition:.16s var(--ease);display:block}
.sw:hover{transform:translateY(-2px) scale(1.04)}
.sw.on{box-shadow:0 0 0 2px #12333a,0 0 0 4px var(--c)}
.sw.on::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.sw-add{background:rgba(255,255,255,.05);border:1.5px dashed var(--line-2);color:var(--dim);display:grid;place-items:center;font-size:15px}
.sw-add:hover{border-color:var(--teal);color:var(--teal);background:rgba(47,214,181,.06)}
.sw-edit{position:absolute;top:-7px;right:-7px;width:19px;height:19px;border-radius:6px;background:#0e2d34;
  border:1px solid var(--line-2);color:var(--dim);font-size:9px;display:grid;place-items:center;opacity:0;transition:.15s;z-index:2}
.sw-wrap:hover .sw-edit{opacity:1}
.sw-edit:hover{color:var(--ink);background:#17474f;transform:scale(1.15)}
.lab-editor{margin-top:12px;background:rgba(4,20,24,.5);border:1px solid var(--line);border-radius:12px;
  padding:13px;display:flex;flex-direction:column;gap:11px;animation:popIn .25s var(--ease)}
.le-head{display:flex;justify-content:space-between;align-items:center;font:700 11.5px var(--disp);letter-spacing:.12em;color:var(--dim)}
.le-colors{display:flex;flex-wrap:wrap;gap:8px}
.le-c{width:26px;height:26px;border-radius:8px;background:var(--c);transition:.15s var(--ease)}
.le-c:hover{transform:scale(1.14)}
.le-c.on{box-shadow:0 0 0 2px #10313a,0 0 0 4px var(--c)}
.le-row{justify-content:space-between}
.le-preview{background:var(--c);color:#fff;font-size:11.5px;font-weight:700;padding:3px 12px;border-radius:999px;text-shadow:0 1px 2px rgba(0,0,0,.25);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-members{display:flex;flex-wrap:wrap;gap:11px 13px;align-items:center}
.mav-btn{position:relative;width:38px;height:38px;border-radius:50%;background:var(--c);color:#0a252b;font-weight:800;font-size:13px;
  display:grid;place-items:center;border:2px solid transparent;transition:.16s var(--ease);overflow:hidden}
.mav-btn:hover{transform:translateY(-2px)}

<script>
'use strict';
/* ---------- 工具 ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const short=s=>s.length>10?s.slice(0,10)+'…':s;
const EASE='cubic-bezier(.22,.9,.3,1)';
const pad2=n=>String(n).padStart(2,'0');
function dayISO(offset=0){const d=new Date(Date.now()+offset*86400000);return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;}
const todayISO=()=>dayISO(0);
function toLocalInput(ts){const d=new Date(ts);return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;}
function parseISODate(s){const [y,m,d]=String(s).split('-').map(Number);return new Date(y||1970,(m||1)-1,d||1);}
function fmtMD(iso){
  if(!iso)return '';
  const d=String(iso).length<=10?parseISODate(iso):new Date(iso);
  if(isNaN(d))return '';
  const md=`${d.getMonth()+1}月${d.getDate()}日`;
  return d.getFullYear()===new Date().getFullYear()?md:`${d.getFullYear()}年${md}`;
}
/* 到期预警状态：over 已超时 / soon 24h 内 / ok 未到期 */
function dueInfo(card){
  if(!card.due)return null;
  const t=new Date(card.due).getTime();
  if(isNaN(t))return null;
  const diff=t-Date.now(),h=Math.abs(diff)/3600000,d=Math.floor(h/24);
  if(diff<0)return{state:'over',text:h<24?`逾期${Math.max(1,Math.floor(h))}小时`:`逾期${Math.max(1,d)}天`};
  if(diff<86400000)return{state:'soon',text:`剩${Math.max(1,Math.floor(h))}小时`};
  return{state:'ok',text:`剩${Math.ceil(diff/86400000)}天`};
}
function dueHintHtml(card){
  if(!card.due)return '未设置到期提醒';
  const info=dueInfo(card);if(!info)return '时间格式无效';
  if(info.state==='over')return `<span style="color:#ff9d93">⚠ 已超时 · ${info.text}</span>`;
  if(info.state==='soon')return `<span style="color:var(--amber)">⏳ 即将到期 · ${info.text}</span>`;
  return `<span style="color:var(--dim)">距到期 ${info.text}</span>`;
}

/* ---------- 标签 & 成员体系 ---------- */
const DEFAULT_LABELS=[
  {id:'amber',n:'琥珀',c:'#ffb84d'},{id:'coral',n:'珊瑚',c:'#ff6b5e'},
  {id:'rose',n:'蔷薇',c:'#ef5da8'},{id:'grape',n:'葡萄',c:'#a06df5'},
  {id:'sky',n:'天青',c:'#4aa8ff'},{id:'teal',n:'湖绿',c:'#2fd6b5'},
  {id:'leaf',n:'新绿',c:'#8bd450'},{id:'slate',n:'岩灰',c:'#8fa3b5'}
];
const COLOR_CHOICES=['#ffb84d','#ff8a3d','#ff6b5e','#ef5da8','#a06df5','#6d87f5','#4aa8ff','#39c6e8','#2fd6b5','#8bd450','#c9d64f','#8fa3b5'];
const DEFAULT_MEMBERS=[
  {id:'u-lin',n:'林',c:'#ffcf7d'},{id:'u-chen',n:'陈',c:'#7de8d2'},{id:'u-su',n:'苏',c:'#ffb3d9'}
];
const MEMBER_COLORS=['#ffcf7d','#7de8d2','#ffb3d9','#b9a7ff','#9fd0ff','#b6ef8f','#ffb59a','#9ee7e0','#e3d97a','#c7cede'];
const LIST_DOTS=['#4aa8ff','#ffb84d','#ef5da8','#8bd450','#a06df5','#2fd6b5','#ff6b5e'];
const STATUS={done:{n:'已完成',c:'#2fd6b5'},doing:{n:'进行中',c:'#ffb84d'},todo:{n:'未开始',c:'rgba(143,163,181,.8)'}};
const ICO={
  tag:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4h7l9 9-7 7-9-9z"/><circle cx="9" cy="9" r="1.5" fill="currentColor" stroke="none"/></svg>',
  desc:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  check:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 12.5l2.6 2.6L16.5 9"/></svg>',
  user:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5"/></svg>',
  cal:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  calMini:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  copy:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H16"/></svg>',
  eyeOpen:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg>',
  eyeShut:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4l18 16"/><path d="M10.6 6.1c.46-.07.93-.1 1.4-.1 6.5 0 10 6.5 10 6.5a17.4 17.4 0 0 1-2.6 3.3M6.7 8.4A16.7 16.7 0 0 0 2 12.5s3.5 6.5 10 6.5c1.2 0 2.3-.2 3.3-.6"/></svg>'
};

/* ---------- 数据 ---------- */
const KEY='aurora-kanban-v2';
const C=(title,o={})=>({id:uid(),title,desc:o.d||'',showDesc:!!o.sd,hidden:false,
  date:dayISO(o.dt||0),due:o.dueH!=null?toLocalInput(Date.now()+o.dueH*3600000):'',
  labels:o.l||[],members:o.m||[],
  check:(o.c||[]).map(([t,d])=>({id:uid(),text:t,done:!!d}))});
const L=(title,cards)=>({id:uid(),title,cards});
function seed(){return {
  title:'红黄蓝看板',
  labels:DEFAULT_LABELS.map(l=>({...l})),
  members:DEFAULT_MEMBERS.map(m=>({...m})),
  lists:[
    L('待办 · Backlog',[
      C('梳理拖拽交互的 12 个细节',{l:['amber','teal'],m:['u-lin','u-chen'],dt:-6,dueH:-26,d:'占位动画、边缘滚动、磁吸插入……逐条过一遍验收标准。',c:[['占位符平滑让位',1],['ghost 跟手 + 轻微旋转',1],['松手回落动画',0],['触屏长按支持',0]]}),
      C('竞品走查：Linear / Height / Notion',{l:['slate'],m:['u-su'],dt:-4,dueH:18,c:[['截图与录屏',1],['输出对比结论',0]]}),
      C('收集暗色主题的灵感截图',{l:['grape','rose'],m:['u-chen'],dt:-2}),
    ]),
    L('进行中',[
      C('跨列表拖拽 + FLIP 让位动画',{l:['amber'],m:['u-lin'],dt:-3,dueH:72,sd:1,d:'记录位移 → 反向 transform → transition 归零，丝滑。这段描述通过「显示在卡片上」开关直接展示在封面。',c:[['捕获旧位置',1],['插入占位',1],['FLIP 归位',1],['触屏适配',0]]}),
      C('看板边缘自动滚动调参',{l:['amber','teal'],dt:-3,dueH:30,c:[['横向滚动',1],['列表内纵向滚动',0],['速度曲线',0]]}),
      C('卡片原位放大弹窗',{l:['grape'],m:['u-chen','u-su'],dt:-2,dueH:120,d:'从卡片 rect 直接 morph 到居中弹窗，关闭再飞回原位。',c:[['rect 捕获',1],['morph 过渡',1],['内容回填',0],['关闭飞回',0]]}),
    ]),
    L('评审 · QA',[
      C('Safari 下 backdrop-filter 兼容',{l:['sky'],m:['u-su'],dt:-1,dueH:-6}),
      C('触屏长按拖拽体验',{l:['coral','leaf'],dt:-1,dueH:48,c:[['长按 260ms 起拖',1],['滚动与拖拽冲突',0]]}),
    ]),
    L('已上线 🚀',[
      C('本地存储自动保存',{l:['leaf'],dt:-8,c:[['序列化',1],['防抖写入',1],['容错回退',1]]}),
      C('八色标签调色板',{l:['rose','grape'],m:['u-chen'],dt:-7,c:[['色板设计',1],['弹窗内切换',1]]}),
    ]),
  ]
};}
let state;
try{state=JSON.parse(localStorage.getItem(KEY));}catch(e){}
if(!state||!Array.isArray(state.lists))state=seed();
if(!Array.isArray(state.labels))state.labels=DEFAULT_LABELS.map(l=>({...l}));
if(!Array.isArray(state.members))state.members=DEFAULT_MEMBERS.map(m=>({...m}));
const labelById=id=>state.labels.find(l=>l.id===id);
const memberById=id=>state.members.find(m=>m.id===id);
function normalizeState(){
  if(!Array.isArray(state.labels))state.labels=DEFAULT_LABELS.map(l=>({...l}));
  if(!Array.isArray(state.members))state.members=DEFAULT_MEMBERS.map(m=>({...m}));
  if(state.title==='极光计划')state.title='红黄蓝看板';
  if(typeof state.title!=='string'||!state.title.trim())state.title='红黄蓝看板';
  state.lists.forEach(l=>{
    l.title=l.title||'列表';l.cards=l.cards||[];
    l.cards.forEach(c=>{
      c.title=c.title||'';c.desc=c.desc||'';c.check=c.check||[];
      c.showDesc=!!c.showDesc;c.hidden=!!c.hidden;
      c.date=c.date||todayISO();c.due=c.due||'';

function computeStats(){
  const all=[];state.lists.forEach(l=>l.cards.forEach(c=>all.push(c)));
  const cnt={done:0,doing:0,todo:0};
  all.forEach(c=>cnt[cardStatus(c)]++);
  const byLabel=state.labels.map(lab=>{
    const cards=all.filter(c=>c.labels.includes(lab.id));
    const c3={done:0,doing:0,todo:0};cards.forEach(c=>c3[cardStatus(c)]++);
    return {lab,total:cards.length,c3};
  });
  const none=all.filter(c=>!c.labels.length);
  const n3={done:0,doing:0,todo:0};none.forEach(c=>n3[cardStatus(c)]++);
  return {total:all.length,cnt,byLabel,none:{total:none.length,c3:n3}};
}
const segHtml=(n,t,cls)=>`<i class="${cls}" data-w="${t?(n/t*100).toFixed(1):0}%"></i>`;

/* ---------- FLIP ---------- */
function captureRects(els){const m=new Map();els.forEach(el=>m.set(el,el.getBoundingClientRect()));return m;}
function applyFlip(rects){
  rects.forEach((r,el)=>{
    if(!el.isConnected)return;
    const n=el.getBoundingClientRect(),dx=r.left-n.left,dy=r.top-n.top;
    if(Math.abs(dx)<1&&Math.abs(dy)<1)return;
    el.style.transition='none';el.style.transform=`translate(${dx}px,${dy}px)`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      el.style.transition=`transform .3s ${EASE}`;el.style.transform='';
      const done=()=>{el.style.transition='';el.removeEventListener('transitionend',done);};
      el.addEventListener('transitionend',done);
    }));
  });
}
function collapseEl(el,done){
  if(el.dataset.collapsing)return;el.dataset.collapsing='1';
  const h=el.offsetHeight;
  el.style.height=h+'px';el.style.boxSizing='border-box';
  void el.offsetHeight;el.classList.add('collapse');
  el.style.height='0px';el.style.opacity='0';el.style.marginBottom='0px';
  setTimeout(()=>{el.remove();done&&done();},300);
}

/* ---------- 复制卡片 ---------- */
function duplicateCard(id){

    id:uid(),

    check:src.check.map(i=>({id:uid(),text:i.text,done:i.done}))
  };
  f.list.cards.splice(f.index+1,0,copy);
  const srcEl=cardEl(id),le=listEl(f.list.id);
  if(srcEl&&le){
    const sc=$('.cards',le);
    const rects=captureRects($$('.card',sc));
    const node=buildCard(copy);node.classList.add('pop-in');
    srcEl.after(node);
    applyFlip(rects);
    const nr=node.getBoundingClientRect(),sr=sc.getBoundingClientRect();
    if(nr.bottom>sr.bottom||nr.top<sr.top)node.scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  refreshCounts();save();applyFilters();
  toast(`已复制「${short(src.title)}」`);

/* ---------- 拖拽系统 ---------- */
let drag=null,mOpen=null,modalCard=null;
const closeAllMenus=()=>$$('.lmenu.open').forEach(m=>m.classList.remove('open'));

board.addEventListener('pointerdown',e=>{
  if(drag||(e.button!==undefined&&e.button!==0))return;
  if(mOpen)return;
  if(e.target.closest('button,input,textarea,.lmenu'))return;
  const cEl=e.target.closest('.card');
  const headEl=e.target.closest('.list-head');
  if(!cEl&&!headEl)return;
  const type=cEl?'card':'list';
  const el=cEl||headEl.closest('.list');
  if(el.classList.contains('ph'))return;
  drag={type,el,listEl:type==='list'?el:null,sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,
        px:e.clientX,py:e.clientY,started:false,moved:false,ghost:null,over:null,
        downTitle:!!e.target.closest('.list-title'),holdT:null,raf:0,gx:0,gy:0};
  if(e.pointerType==='touch')drag.holdT=setTimeout(()=>{if(drag&&!drag.started&&!drag.moved)beginDrag();},260);
  if(e.pointerType==='mouse')e.preventDefault();
});

window.addEventListener('pointermove',e=>{
  if(!drag)return;
  const x=e.clientX,y=e.clientY;
  if(!drag.started){
    const dist=Math.hypot(x-drag.sx,y-drag.sy);
    if(e.pointerType==='mouse'){if(dist>5)beginDrag();}
    else{
      if(dist>10){drag.moved=true;clearTimeout(drag.holdT);}
      if(drag.moved){
        const dx=x-drag.px,dy=y-drag.py;drag.px=x;drag.py=y;
        if(drag.type==='card'&&Math.abs(dy)>=Math.abs(dx)){
          const sc=drag.el.closest('.list')?.querySelector('.cards');sc&&(sc.scrollTop-=dy);
        }else boardWrap.scrollLeft-=dx;
      }
    }
    return;
  }
  drag.lx=x;drag.ly=y;drag.moved=true;
  drag.ghost.style.transform=`translate(${x-drag.sx}px,${y-drag.sy}px) rotate(${drag.type==='card'?3.2:1.5}deg) scale(1.03)`;
  drag.type==='card'?updateCardTarget():updateListTarget();
});

window.addEventListener('pointerup',()=>{
  if(!drag)return;
  clearTimeout(drag.holdT);
  const d=drag;
  if(!d.started){
    drag=null;
    if(!d.moved){
      if(d.type==='card'){
        const f=findCard(d.el.dataset.id);
        if(f&&f.card.hidden){f.card.hidden=false;refreshCardEl(f.card);save();updateHideBtn();}
        else openModal(d.el);
      }
      else if(d.downTitle)startRename(d.listEl);
    }
    return;
  }
  finishDrag();
});
window.addEventListener('pointercancel',()=>{if(!drag)return;clearTimeout(drag.holdT);drag.started?finishDrag():drag=null;});
board.addEventListener('contextmenu',e=>{if(drag)e.preventDefault();});

function beginDrag(){
  const d=drag,el=d.el,r=el.getBoundingClientRect();
  clearTimeout(d.holdT);closeAllMenus();
  const g=el.cloneNode(true);g.classList.add('ghost');
  g.style.width=r.width+'px';g.style.left=r.left+'px';g.style.top=r.top+'px';
  if(d.type==='list'){g.style.height=r.height+'px';$$('.cards',g).forEach(c=>c.style.overflow='hidden');}
  document.body.appendChild(g);
  d.ghost=g;d.gx=r.left;d.gy=r.top;d.started=true;
  el.classList.add('ph');
  document.body.classList.add('is-dragging');
  if(navigator.vibrate)try{navigator.vibrate(8);}catch(e){}
  d.type==='card'?updateCardTarget():updateListTarget();
  startAutoScroll();
}
function updateCardTarget(){
  const d=drag,x=d.lx,y=d.ly;
  const lists=$$('.list',board);if(!lists.length)return;
  let best=null,bd=1e9;
  for(const l of lists){const r=l.getBoundingClientRect();
    const inside=x>=r.left&&x<=r.right;
    const dist=inside?0:Math.min(Math.abs(x-r.left),Math.abs(x-r.right));
    if(dist<bd){bd=dist;best=l;}}
  d.over=best;
  lists.forEach(l=>l.classList.toggle('list--over',l===best));
  const cardsEl=$('.cards',best);
  const sibs=$$('.card',cardsEl).filter(c=>c!==d.el);
  let before=null;
  for(const s of sibs){const r=s.getBoundingClientRect();if(y<r.top+r.height/2){before=s;break;}}
  const next=d.el.nextElementSibling;
  if(before?next===before:(d.el.parentElement===cardsEl&&!next))return;
  const scope=new Set([...cardsEl.children,...(d.el.parentElement?d.el.parentElement.children:[])]);
  const rects=captureRects([...scope].filter(n=>n.classList.contains('card')));
  before?cardsEl.insertBefore(d.el,before):cardsEl.appendChild(d.el);
  applyFlip(rects);
}
function updateListTarget(){
  const d=drag,x=d.lx;
  const sibs=$$('.list',board).filter(l=>l!==d.el);
  let before=null;
  for(const s of sibs){const r=s.getBoundingClientRect();if(x<r.left+r.width/2){before=s;break;}}
  const expected=before||composerEl;
  if(d.el.nextElementSibling===expected&&d.el.parentElement===board)return;
  const rects=captureRects([...board.children]);
  board.insertBefore(d.el,expected);
  applyFlip(rects);
}
function startAutoScroll(){
  const EDGE=64,MAX=16;
  const step=()=>{
    if(!drag||!drag.started)return;
    let moved=false;
    const br=boardWrap.getBoundingClientRect();let dx=0;
    if(drag.lx<br.left+EDGE)dx=-Math.ceil((br.left+EDGE-drag.lx)/EDGE*MAX);
    else if(drag.lx>br.right-EDGE)dx=Math.ceil((drag.lx-(br.right-EDGE))/EDGE*MAX);
    if(dx){boardWrap.scrollLeft+=dx;moved=true;}
    if(drag.type==='card'&&drag.over){
      const sc=$('.cards',drag.over),r=sc.getBoundingClientRect();
      if(r.height>EDGE*1.5){let dy=0;
        if(drag.ly<r.top+EDGE)dy=-Math.ceil((r.top+EDGE-drag.ly)/EDGE*MAX);
        else if(drag.ly>r.bottom-EDGE)dy=Math.ceil((drag.ly-(r.bottom-EDGE))/EDGE*MAX);
        if(dy){sc.scrollTop+=dy;moved=true;}}
    }
    if(moved)drag.type==='card'?updateCardTarget():updateListTarget();
    drag.raf=requestAnimationFrame(step);
  };
  drag.raf=requestAnimationFrame(step);
}
function finishDrag(){
  const d=drag;drag=null;
  cancelAnimationFrame(d.raf);
  $$('.list--over',board).forEach(l=>l.classList.remove('list--over'));
  document.body.classList.remove('is-dragging');
  const slot=d.el,g=d.ghost,r=slot.getBoundingClientRect();
  g.style.transition=`transform .24s ${EASE}`;
  g.style.transform=`translate(${r.left-d.gx}px,${r.top-d.gy}px) rotate(0deg) scale(1)`;
  setTimeout(()=>{
    g.remove();slot.classList.remove('ph');
    if(slot.animate)slot.animate([{transform:'scale(.965)'},{transform:'scale(1)'}],{duration:200,easing:'ease-out'});
  },240);
  syncFromDOM();
}
function syncFromDOM(){
  const all=new Map();
  state.lists.forEach(l=>l.cards.forEach(c=>all.set(c.id,c)));
  const order=$$('.list',board).map(n=>n.dataset.id);
  state.lists.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
  state.lists.forEach(l=>{
    const el=listEl(l.id);if(!el)return;
    l.cards=$$('.card',el).map(n=>all.get(n.dataset.id)).filter(Boolean);
  });
  refreshCounts();save();applyFilters();
}

function startRename(listNode){

  const data=state.lists.find(l=>l.id===listNode.dataset.id);

  if(!data||!tEl||listNode.querySelector('.rn'))return;

  inp.className='rn';inp.value=data.title;inp.placeholder='输入列表标题';inp.maxLength=40;
  tEl.replaceWith(inp);
  let settled=false;
  const rebuild=()=>{
    const h=document.createElement('h2');
    h.className='list-title';h.title='点击重命名 · 按住拖动换序';
    h.textContent=data.title;
    if(inp.isConnected)inp.replaceWith(h);
  };
  const commit=()=>{
    if(settled)return;settled=true;
    const v=inp.value.trim();
    if(v)data.title=v;
    save();rebuild();
  };
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();inp.blur();}
    else if(e.key==='Escape'){settled=true;rebuild();}

  inp.addEventListener('blur',commit);
  requestAnimationFrame(()=>{inp.focus({preventScroll:true});inp.select();});
}

function openComposerForm(list){
  $('.composer-form',list).hidden=false;$('.composer-open',list).style.display='none';
  const ta=$('textarea',list);ta.value='';ta.focus();
  const sc=$('.cards',list);sc.scrollTop=sc.scrollHeight;
}
function submitComposer(list){
  const listNode=listEl(list.id),ta=$('textarea',listNode),v=ta.value.trim();
  if(!v){ta.focus();return;}
  const card={id:uid(),title:v,desc:'',showDesc:false,hidden:false,date:todayISO(),due:'',labels:[],check:[],members:[]};
  list.cards.push(card);
  const el=buildCard(card);el.classList.add('pop-in');
  const sc=$('.cards',listNode);sc.appendChild(el);sc.scrollTop=sc.scrollHeight;
  ta.value='';ta.focus();
  refreshCounts();save();applyFilters();
}
function closeComposerForm(listNode){
  $('.composer-form',listNode).hidden=true;$('.composer-open',listNode).style.display='';
}
function deleteCard(id,fromModal){
  const f=findCard(id);if(!f)return;
  const el=cardEl(id);
  f.list.cards.splice(f.index,1);save();
  if(fromModal)modalCloseInstant();
  if(el)collapseEl(el);
  refreshCounts();
  toast(`已删除「${short(f.card.title)}」`,'撤销',()=>{
    f.list.cards.splice(Math.min(f.index,f.list.cards.length),0,f.card);
    const le=listEl(f.list.id);
    if(le){const sc=$('.cards',le),kids=$$('.card',sc),node=buildCard(f.card);node.classList.add('pop-in');
      const ref=kids[Math.min(f.index,kids.length)];ref?sc.insertBefore(node,ref):sc.appendChild(node);}
    refreshCounts();save();
  });
}

/* ---------- 成员：增删改 ---------- */
function renderAvatarsRow(){
  const row=$('#avRow');if(!row)return;
  row.innerHTML=state.members.map(m=>
    `<button class="av" data-mid="${m.id}" style="--c:${m.c}" title="成员 · ${esc(m.n)}（点击编辑）">${esc((m.n||'?').slice(0,2))}</button>`).join('')
    +`<button class="av add" id="invBtn" title="新建成员">＋</button>`;
}
function createMember(){
  const used=state.members.map(m=>m.c);
  const c=MEMBER_COLORS.find(x=>!used.includes(x))||MEMBER_COLORS[state.members.length%MEMBER_COLORS.length];
  const m={id:uid(),n:'新成员',c};
  state.members.push(m);save();
  return m;
}
function memberEditorHTML(m){
  return `
  <div class="le-head"><span>编辑成员</span><button class="icon-btn" data-act="close-mem" title="收起">✕</button></div>
  <input class="field le-name" value="${esc(m.n)}" placeholder="成员名称" maxlength="8">
  <div class="le-colors">${MEMBER_COLORS.map(c=>`<button class="le-c ${c===m.c?'on':''}" data-act="mem-color" data-k="${m.id}" data-c="${c}" style="--c:${c}" title="${c}"></button>`).join('')}</div>
  <div class="row le-row">
    <button class="btn btn-danger btn-sm" data-act="del-mem" data-k="${m.id}">删除成员</button>
    <span class="le-preview" style="--c:${m.c}">${esc(m.n)||'未命名'}</span>
  </div>`;
}
function openMemberEditor(id,box){
  const m=memberById(id);if(!m||!box)return;
  box.hidden=false;
  box.innerHTML=memberEditorHTML(m);
  const inp=$('.le-name',box);
  inp.addEventListener('input',()=>{
    m.n=inp.value;
    const pv=$('.le-preview',box);if(pv)pv.textContent=m.n||'未命名';
    membersChanged();
  });
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();inp.blur();}});
  inp.focus();inp.select();
}
function renderMembers(){
  const box=$('#mMembers');if(!box||!modalCard)return;
  box.innerHTML=state.members.map(m=>`
    <span class="sw-wrap">
      <button class="mav-btn ${modalCard.members.includes(m.id)?'on':''}" data-act="toggle-mem" data-k="${m.id}" style="--c:${m.c}" title="${esc(m.n)}：点击指派 / 移除">${esc((m.n||'?').slice(0,2))}</button>
      <button class="sw-edit" data-act="edit-mem" data-k="${m.id}" title="编辑「${esc(m.n)}」">✎</button>
    </span>`).join('')
    +`<button class="mav-add" data-act="new-mem" title="新建成员">＋</button>`;
}
function membersChanged(){
  renderAvatarsRow();
  refreshAllCardEls();
  if(mOpen&&!mOpen.deleted&&modalCard)renderMembers();
  save();
}
$('#avatars').addEventListener('click',e=>{
  const av=e.target.closest('.av[data-mid]');
  if(av){openMemberEditor(av.dataset.mid,$('#memPop'));return;}
  if(e.target.closest('#invBtn')){
    const m=createMember();
    membersChanged();
    openMemberEditor(m.id,$('#memPop'));
  }
});

/* ---------- 标签编辑 ---------- */
function openLabelEditor(id){
  const lab=labelById(id);if(!lab)return;
  const ed=$('#labEditor');if(!ed)return;
  ed.hidden=false;
  ed.innerHTML=`
  <div class="le-head"><span>编辑标签</span><button class="icon-btn" data-act="close-lab-editor" title="收起">✕</button></div>
  <input class="field le-name" value="${esc(lab.n)}" placeholder="标签名称" maxlength="12">
  <div class="le-colors">${COLOR_CHOICES.map(c=>`<button class="le-c ${c===lab.c?'on':''}" data-act="lab-color" data-k="${id}" data-c="${c}" style="--c:${c}" title="${c}"></button>`).join('')}</div>
  <div class="row le-row">
    <button class="btn btn-danger btn-sm" data-act="del-label" data-k="${id}">删除标签</button>
    <span class="le-preview" style="--c:${lab.c}">${esc(lab.n)||'未命名'}</span>
  </div>`;
  const nameInp=$('.le-name',ed);
  nameInp.addEventListener('input',()=>{
    lab.n=nameInp.value;
    const pv=$('.le-preview',ed);if(pv)pv.textContent=lab.n||'未命名';
    labelChanged();
  });
  nameInp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();nameInp.blur();}});
  nameInp.focus();nameInp.select();
}
function labelChanged(){
  renderHeaderFilters();
  refreshAllCardEls();
  if(mOpen&&!mOpen.deleted&&modalCard)renderModalChips(modalCard);
  applyFilters();save();
}

/* ---------- 点击委托 ---------- */
document.addEventListener('click',e=>{
  const pop=$('#memPop');
  if(pop&&!pop.hidden&&!e.target.closest('#memPop,#avatars'))pop.hidden=true;
  const menus=$$('.lmenu.open');
  const act=e.target.closest('[data-act]');
  if(!act){closeAllMenus();return;}
  const a=act.dataset.act;
  if(a==='menu'){
    const m=act.closest('.list-head').querySelector('.lmenu'),was=m.classList.contains('open');
    closeAllMenus();if(!was)m.classList.add('open');return;
  }
  closeAllMenus();
  const listNode=act.closest('.list');
  const list=listNode?state.lists.find(l=>l.id===listNode.dataset.id):null;
  switch(a){
    case 'add-card':openComposerForm(listNode);break;
    case 'rename':startRename(listNode);break;
    case 'open-composer':openComposerForm(listNode);break;
    case 'cancel-composer':closeComposerForm(listNode);break;
    case 'del-card':deleteCard(act.closest('.card').dataset.id,false);break;
    case 'copy-card':duplicateCard(act.closest('.card').dataset.id);break;
    case 'toggle-hide':toggleHideCard(act.closest('.card').dataset.id);break;
    case 'clear':{
      if(!list.cards.length)return;
      const removed=list.cards.slice();
      list.cards=[];save();refreshCounts();
      $$('.card',listNode).forEach((el,i)=>setTimeout(()=>collapseEl(el),i*40));
      toast(`已清空「${short(list.title)}」的 ${removed.length} 张卡片`,'撤销',()=>{
        list.cards=removed;const le=listEl(list.id);
        if(le){const sc=$('.cards',le);removed.forEach(c=>{const n=buildCard(c);n.classList.add('pop-in');sc.appendChild(n);});}
        refreshCounts();save();
      });
      break;}
    case 'del-list':{
      const idx=state.lists.indexOf(list);
      state.lists.splice(idx,1);save();refreshCounts();
      listNode.style.width=listNode.getBoundingClientRect().width+'px';
      listNode.classList.add('collapse');
      requestAnimationFrame(()=>listNode.classList.add('l-out'));
      setTimeout(()=>listNode.remove(),300);
      toast(`已删除列表「${short(list.title)}」`,'撤销',()=>{
        state.lists.splice(Math.min(idx,state.lists.length),0,list);
        const n=buildList(list);n.classList.add('list-pop');
        const kids=$$('.list',board),ref=kids[Math.min(idx,kids.length)];
        ref?board.insertBefore(n,ref):board.insertBefore(n,composerEl);
        refreshCounts();save();
      });
      break;}
    case 'sw':{
      const f=findCard(act.dataset.id);if(!f)break;
      const k=act.dataset.k,i=f.card.labels.indexOf(k);
      i>-1?f.card.labels.splice(i,1):f.card.labels.push(k);
      save();renderModalChips(f.card);renderPalette();refreshCardEl(f.card);applyFilters();
      break;}
    case 'edit-label':openLabelEditor(act.dataset.k);break;
    case 'new-label':{
      const used=state.labels.map(l=>l.c);
      const color=COLOR_CHOICES.find(c=>!used.includes(c))||COLOR_CHOICES[state.labels.length%COLOR_CHOICES.length];
      const lab={id:uid(),n:'新标签',c:color};
      state.labels.push(lab);save();
      renderPalette();renderHeaderFilters();openLabelEditor(lab.id);
      break;}
    case 'lab-color':{
      const lab=labelById(act.dataset.k);if(!lab)break;
      lab.c=act.dataset.c;save();
      $$('.le-c').forEach(b=>b.classList.toggle('on',b.dataset.c===lab.c));
      const pv=$('.le-preview');pv&&pv.style.setProperty('--c',lab.c);
      labelChanged();
      break;}
    case 'del-label':{
      const id=act.dataset.k;
      state.labels=state.labels.filter(l=>l.id!==id);
      state.lists.forEach(l=>l.cards.forEach(c=>c.labels=c.labels.filter(k=>k!==id)));
      save();
      const le=$('#labEditor');le&&(le.hidden=true);
      renderPalette();labelChanged();
      toast('标签已删除，相关卡片已同步移除');
      break;}
    case 'close-lab-editor':{const le=$('#labEditor');le&&(le.hidden=true);break;}
    case 'toggle-mem':{
      if(!modalCard)break;
      const k=act.dataset.k,i=modalCard.members.indexOf(k);
      i>-1?modalCard.members.splice(i,1):modalCard.members.push(k);
      save();renderMembers();refreshCardEl(modalCard);
      break;}
    case 'edit-mem':{
      const box=act.closest('.modal')?$('#memEditor'):$('#memPop');
      openMemberEditor(act.dataset.k,box);
      break;}
    case 'new-mem':{
      const m=createMember();
      membersChanged();
      const box=act.closest('.modal')?$('#memEditor'):$('#memPop');
      openMemberEditor(m.id,box);
      break;}
    case 'mem-color':{
      const m=memberById(act.dataset.k);if(!m)break;
      m.c=act.dataset.c;save();
      const box=act.closest('#memPop,#memEditor');
      if(box){$$('.le-c',box).forEach(b=>b.classList.toggle('on',b.dataset.c===m.c));
        const pv=$('.le-preview',box);pv&&pv.style.setProperty('--c',m.c);}
      membersChanged();
      break;}
    case 'del-mem':{
      const id=act.dataset.k;
      state.members=state.members.filter(x=>x.id!==id);
      state.lists.forEach(l=>l.cards.forEach(c=>c.members=c.members.filter(k=>k!==id)));
      save();
      const box=act.closest('#memPop,#memEditor');box&&(box.hidden=true);
      membersChanged();
      toast('成员已删除，相关卡片已同步移除');
      break;}
    case 'close-mem':{
      const box=act.closest('#memPop,#memEditor');box&&(box.hidden=true);
      break;}
  }
});

board.addEventListener('submit',e=>{
  const form=e.target.closest('.composer-form');if(!form)return;
  e.preventDefault();
  const listNode=form.closest('.list'),list=state.lists.find(l=>l.id===listNode.dataset.id);
  submitComposer(list);
});
board.addEventListener('keydown',e=>{
  if(e.target.matches('.composer-form textarea')){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();
      const listNode=e.target.closest('.list');submitComposer(state.lists.find(l=>l.id===listNode.dataset.id));}
    else if(e.key==='Escape')closeComposerForm(e.target.closest('.list'));
  }else if(e.key==='Enter'&&e.target.classList.contains('card')){
    const f=findCard(e.target.dataset.id);
    if(f&&f.card.hidden){f.card.hidden=false;refreshCardEl(f.card);save();updateHideBtn();}
    else openModal(e.target);
  }
});

/* ---------- 列表添加器 ---------- */
$('#lcOpen').addEventListener('click',()=>{
  $('#lcOpen').hidden=true;$('#lcForm').hidden=false;$('#lcInput').value='';$('#lcInput').focus();
});
$('#lcCancel').addEventListener('click',()=>{$('#lcForm').hidden=true;$('#lcOpen').hidden=false;});
$('#lcForm').addEventListener('submit',e=>{
  e.preventDefault();
  const v=$('#lcInput').value.trim();if(!v)return;
  const list={id:uid(),title:v,cards:[]};
  state.lists.push(list);
  const n=buildList(list);n.classList.add('list-pop');
  board.insertBefore(n,composerEl);
  n.scrollIntoView({behavior:'smooth',inline:'end',block:'nearest'});
  $('#lcInput').value='';save();refreshCounts();openComposerForm(n);
});
$('#addListBtn').addEventListener('click',()=>{
  composerEl.scrollIntoView({behavior:'smooth',inline:'end',block:'nearest'});
  setTimeout(()=>{if($('#lcForm').hidden)$('#lcOpen').click();else $('#lcInput').focus();},250);
});

/* ---------- 备份 / 导入 ---------- */
$('#exportBtn').addEventListener('click',()=>{
  try{
    const payload=JSON.stringify({app:'红黄蓝看板',version:2,exportedAt:new Date().toISOString(),state},null,2);
    const blob=new Blob([payload],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const d=new Date();
    const a=document.createElement('a');
    a.href=url;
    a.download=`红黄蓝看板-${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}.json`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),800);
    toast('备份文件已下载，妥善保存即可');
  }catch(err){toast('备份失败：'+err.message);}
});
$('#importBtn').addEventListener('click',()=>$('#importFile').click());
$('#importFile').addEventListener('change',e=>{
  const file=e.target.files[0];e.target.value='';
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      let data=JSON.parse(reader.result);
      if(data&&data.state&&Array.isArray(data.state.lists))data=data.state;
      if(!data||!Array.isArray(data.lists))throw new Error('文件格式不正确（缺少 lists）');
      if(!confirm(`即将导入「${data.title||'未命名'}」（${data.lists.length} 个列表），将覆盖当前看板，确定继续？`))return;
      if(mOpen)modalCloseInstant();
      closeAllMenus();
      state=data;
      normalizeState();
      boardTitle.textContent=state.title;
      activeFilters.clear();
      renderHeaderFilters();renderAvatarsRow();syncBoard();applyFilters();
      save();
      toast('备份导入成功');
    }catch(err){toast('导入失败：'+err.message);}
  };
  reader.onerror=()=>toast('读取文件失败');
  reader.readAsText(file);
});

/* ---------- 卡片弹窗（原位放大） ---------- */
function openModal(cardNode){
  const f=findCard(cardNode.dataset.id);if(!f)return;
  mOpen={id:f.card.id,deleted:false};modalCard=f.card;
  renderModal(f.card,f.list);
  const r=cardNode.getBoundingClientRect();
  cardNode.classList.add('lifted');
  overlay.hidden=false;modalIn.scrollTop=0;
  requestAnimationFrame(()=>overlay.classList.add('show'));
  modal.classList.remove('anim');modal.style.opacity='1';modal.style.transform='none';
  Object.assign(modal.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',borderRadius:'14px'});
  void modal.offsetWidth;
  const w=Math.min(620,innerWidth-28),h=Math.min(680,innerHeight-40);
  modal.classList.add('anim');
  Object.assign(modal.style,{left:((innerWidth-w)/2)+'px',top:((innerHeight-h)/2-4)+'px',width:w+'px',height:h+'px',borderRadius:'20px'});
  document.body.classList.add('modal-open');
}
function renderModal(card,list){
  modalIn.innerHTML=`
  <div class="m-top"><div class="m-chips" id="mChips"></div></div>
  <input class="m-title" id="mTitle" value="${esc(card.title)}" spellcheck="false" title="点击修改标题">
  <div class="m-crumb">所在列表 <b>${esc(list.title)}</b></div>
  <section class="m-sec"><h4>${ICO.tag} 标签 <span class="cnt">点色块应用 · 悬停 ✎ 可编辑 / 新建</span></h4>
    <div class="m-palette" id="mPalette"></div>
    <div class="lab-editor" id="labEditor" hidden></div></section>
  <section class="m-sec"><h4>${ICO.user} 成员 <span class="cnt">点头像指派 · 悬停 ✎ 可编辑 / 新建</span></h4>
    <div class="m-members" id="mMembers"></div>
    <div class="lab-editor" id="memEditor" hidden></div></section>
  <section class="m-sec"><h4>${ICO.cal} 日期与提醒 <span class="cnt" id="mDueHint"></span></h4>
    <div class="m-dates">
      <label class="m-date"><span>添加日期</span><input type="date" class="field" id="mDate"></label>
      <label class="m-date"><span>到期时间（超时预警）</span><input type="datetime-local" class="field" id="mDue"></label>
      <button class="btn btn-ghost btn-sm" id="mDueClear" title="清除到期提醒">清除</button>
    </div>
  </section>
  <section class="m-sec"><h4>${ICO.desc} 描述
    <label class="dswitch" title="开启后，描述摘要将直接显示在卡片封面">
      <input type="checkbox" id="mShowDesc"><i></i><span>显示在卡片上</span>
    </label></h4>
    <textarea class="m-desc" id="mDesc" placeholder="补充背景、链接、验收标准…">${esc(card.desc)}</textarea></section>
  <section class="m-sec"><h4>${ICO.check} 检查清单 <span class="cnt" id="mProgTxt"></span></h4>
    <div class="prog-wrap"><div class="prog"><i id="mProgBar"></i></div></div>
    <div id="mItems"></div>
    <div class="m-add"><input class="field" id="mNewItem" placeholder="添加清单项，Enter 确认" autocomplete="off">
      <button class="btn btn-primary btn-sm" id="mAddItem">添加</button></div></section>
  <footer class="m-foot"><span class="m-id">#${card.id.slice(0,6).toUpperCase()}</span>
    <div class="row">
      <button class="btn btn-ghost btn-sm" id="mHide" title="隐藏卡片内容">${card.hidden?ICO.eyeOpen+' 取消隐藏':ICO.eyeShut+' 隐藏卡片'}</button>
      <button class="btn btn-ghost btn-sm" id="mCopy" title="复制一张相同的卡片到本列表">${ICO.copy} 复制卡片</button>
      <button class="btn btn-danger" id="mDelete">删除卡片</button>
    </div>
  </footer>`;
  renderModalChips(card);renderPalette();renderMembers();renderItems(card);updateProgress(card);
  $('#mTitle').addEventListener('input',e=>{card.title=e.target.value;refreshCardEl(card);save();});
  $('#mDesc').addEventListener('input',e=>{card.desc=e.target.value;refreshCardEl(card);save();});
  const sd=$('#mShowDesc');
  sd.checked=!!card.showDesc;
  sd.addEventListener('change',()=>{card.showDesc=sd.checked;refreshCardEl(card);save();});
  /* 日期与提醒 */
  const hint=$('#mDueHint');hint.innerHTML=dueHintHtml(card);
  const dInp=$('#mDate');dInp.value=card.date||'';
  dInp.addEventListener('change',()=>{card.date=dInp.value||todayISO();refreshCardEl(card);save();});
  const dueInp=$('#mDue');dueInp.value=card.due||'';
  const syncDue=()=>{card.due=dueInp.value||'';hint.innerHTML=dueHintHtml(card);refreshCardEl(card);save();};
  dueInp.addEventListener('change',syncDue);
  $('#mDueClear').addEventListener('click',()=>{dueInp.value='';syncDue();});
  $('#mItems').addEventListener('click',e=>{
    const row=e.target.closest('.ck-item');if(!row)return;
    const item=card.check.find(i=>i.id===row.dataset.id);if(!item)return;
    if(e.target.closest('.ck')){item.done=!item.done;save();renderItems(card);updateProgress(card);refreshCardEl(card);}
    else if(e.target.closest('.ck-del')){card.check=card.check.filter(i=>i!==item);save();renderItems(card);updateProgress(card);refreshCardEl(card);}
    else if(e.target.closest('.ck-text'))editItem(row,item,card);
  });
  const add=()=>{const inp=$('#mNewItem'),v=inp.value.trim();if(!v)return;
    card.check.push({id:uid(),text:v,done:false});save();inp.value='';inp.focus();
    renderItems(card);updateProgress(card);refreshCardEl(card);};
  $('#mAddItem').addEventListener('click',add);
  $('#mNewItem').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add();}});
  $('#mHide').addEventListener('click',()=>{
    card.hidden=!card.hidden;save();refreshCardEl(card);updateHideBtn();closeModal();
  });
  $('#mCopy').addEventListener('click',()=>duplicateCard(card.id));
  $('#mDelete').addEventListener('click',()=>{mOpen.deleted=true;deleteCard(card.id,true);});
}
function renderModalChips(card){
  const box=$('#mChips');if(!box)return;
  const labs=card.labels.map(labelById).filter(Boolean);
  box.innerHTML=labs.length
    ?labs.map(l=>`<span class="m-chip" style="--c:${l.c}">${esc(l.n)}</span>`).join('')
    :'<span class="m-empty">尚未添加标签，从下方色块选择 →</span>';
}
function renderPalette(){
  const box=$('#mPalette');if(!box||!modalCard)return;
  box.innerHTML=state.labels.map(l=>`
    <span class="sw-wrap">
      <button class="sw ${modalCard.labels.includes(l.id)?'on':''}" data-act="sw" data-k="${l.id}" data-id="${modalCard.id}" style="--c:${l.c}" title="${esc(l.n)}：点击应用 / 取消"></button>
      <button class="sw-edit" data-act="edit-label" data-k="${l.id}" title="编辑「${esc(l.n)}」">✎</button>
    </span>`).join('')
    +`<button class="sw sw-add" data-act="new-label" title="新建标签">＋</button>`;
}
function renderItems(card){
  const box=$('#mItems');if(!box)return;
  box.innerHTML=card.check.map(i=>`
    <div class="ck-item ${i.done?'done':''}" data-id="${i.id}">
      <span class="ck ${i.done?'on':''}" title="切换完成"></span>
      <span class="ck-text">${esc(i.text)}</span>
      <button class="ck-del" title="删除此项">✕</button>
    </div>`).join('')||'<div class="m-empty" style="padding:4px 8px">还没有子任务，先添加一条吧</div>';
}
function updateProgress(card){
  const bar=$('#mProgBar'),txt=$('#mProgTxt');if(!bar)return;
  const t=card.check.length,d=card.check.filter(i=>i.done).length;
  bar.style.width=(t?d/t*100:0)+'%';txt.textContent=t?`${d}/${t}`:'0/0';
}
function editItem(row,item,card){
  const span=$('.ck-text',row);if(!span)return;
  const inp=document.createElement('input');inp.className='ck-edit';inp.value=item.text;
  span.replaceWith(inp);inp.focus();inp.select();
  let doneFlag=false;
  const commit=()=>{if(doneFlag)return;doneFlag=true;
    item.text=inp.value.trim()||item.text;save();renderItems(card);};
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();inp.blur();}
    else if(e.key==='Escape'){doneFlag=true;renderItems(card);}});
  inp.addEventListener('blur',commit);
}
function closeModal(){
  if(!mOpen)return;
  const id=mOpen.id,deleted=mOpen.deleted;
  overlay.classList.remove('show');
  const target=!deleted&&cardEl(id)?cardEl(id).getBoundingClientRect():null;
  if(target){
    modal.classList.add('anim');
    Object.assign(modal.style,{left:target.left+'px',top:target.top+'px',width:target.width+'px',height:target.height+'px',borderRadius:'14px'});
    setTimeout(()=>modalCloseInstant(),410);
  }else{
    modal.style.opacity='0';modal.style.transform='scale(.94)';
    setTimeout(()=>modalCloseInstant(),270);
  }
}
function modalCloseInstant(){
  overlay.hidden=true;overlay.classList.remove('show');
  modal.classList.remove('anim');modal.style.opacity='1';modal.style.transform='none';
  document.body.classList.remove('modal-open');
  if(mOpen&&!mOpen.deleted){const el=cardEl(mOpen.id);el&&el.classList.remove('lifted');}
  mOpen=null;modalCard=null;
}
$('#mCloseBtn').addEventListener('click',closeModal);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});

/* ---------- 顶栏 ---------- */
const boardTitle=$('#boardTitle');
boardTitle.textContent=state.title;
boardTitle.addEventListener('input',()=>{state.title=boardTitle.textContent.trim();save();});
boardTitle.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();boardTitle.blur();}});
boardTitle.addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text'));});

function renderHeaderFilters(){
  activeFilters=new Set([...activeFilters].filter(k=>labelById(k)));
  $('#filters').innerHTML=state.labels.map(l=>
    `<button class="fsw ${activeFilters.has(l.id)?'on':''}" data-k="${l.id}" style="--c:${l.c}" title="过滤：${esc(l.n)}"></button>`).join('');
}
$('#filters').addEventListener('click',e=>{
  const b=e.target.closest('.fsw');if(!b)return;
  const k=b.dataset.k;
  activeFilters.has(k)?activeFilters.delete(k):activeFilters.add(k);
  b.classList.toggle('on');applyFilters();
});
$('#searchInput').addEventListener('input',applyFilters);
function applyFilters(){
  const q=$('#searchInput').value.trim().toLowerCase();
  $$('.card',board).forEach(el=>{
    const f=findCard(el.dataset.id);if(!f)return;
    const okQ=!q||f.card.title.toLowerCase().includes(q)||f.card.desc.toLowerCase().includes(q);
    const okL=[...activeFilters].every(k=>f.card.labels.includes(k));
    el.classList.toggle('faded',!(okQ&&okL));
  });
}

/* ---------- Toast ---------- */
let toastTimer,toastFn;
function toast(msg,label,fn){
  $('#toastMsg').textContent=msg;
  const b=$('#toastAct');b.hidden=!label;b.textContent=label||'';toastFn=fn||null;
  $('#toast').classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),4200);
}
$('#toastAct').addEventListener('click',()=>{toastFn&&toastFn();$('#toast').classList.remove('show');});

/* ---------- 其它 ---------- */
$('#resetBtn').addEventListener('click',()=>{
  if(!confirm('恢复为示例数据？当前看板将被覆盖（建议先点「备份」）。'))return;
  localStorage.removeItem(KEY);state=seed();
  boardTitle.textContent=state.title;
  activeFilters.clear();
  renderHeaderFilters();renderAvatarsRow();syncBoard();applyFilters();
  toast('已恢复示例数据');
});
window.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(mOpen)closeModal();
  else if(statsOpen)closeStats();
  else if($('.lmenu.open'))closeAllMenus();
  else{const pop=$('#memPop');if(pop&&!pop.hidden)pop.hidden=true;
    else if(!$('#lcForm').hidden)$('#lcCancel').click();
    else{const f=$('.composer-form:not([hidden])');f&&closeComposerForm(f.closest('.list'));}}
});
boardWrap.addEventListener('wheel',e=>{
  if(e.target.closest('.modal,.overlay,.toast,.stats-overlay'))return;
  const sc=e.target.closest('.cards');
  if(sc){
    const canD=sc.scrollTop<sc.scrollHeight-sc.clientHeight-1,canU=sc.scrollTop>0;
    if(Math.abs(e.deltaX)>Math.abs(e.deltaY))return;
    if((e.deltaY>0&&canD)||(e.deltaY<0&&canU))return;
    boardWrap.scrollLeft+=e.deltaY;e.preventDefault();
  }else if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){boardWrap.scrollLeft+=e.deltaY;e.preventDefault();}
},{passive:false});

/* ---------- 预警倒计时：每分钟刷新卡片状态 ---------- */
setInterval(()=>{
  if(drag||mOpen||document.hidden)return;
  const hasDue=state.lists.some(l=>l.cards.some(c=>c.due));
  if(hasDue)refreshAllCardEls();
},60000);

/* ---------- 启动 ---------- */
window.addEventListener('error',e=>{console.error(e.error||e.message);});
try{
  renderHeaderFilters();
  renderAvatarsRow();
  syncBoard();
  applyFilters();
}catch(err){
  console.error(err);
  toast('初始化出错：'+err.message);
}
</script>
</body>
</html>
